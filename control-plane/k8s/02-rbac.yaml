apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-control-plane
  namespace: mesh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-control-plane-role
  namespace: mesh
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-control-plane-binding
  namespace: mesh
subjects:
  - kind: ServiceAccount
    name: mesh-control-plane
    namespace: mesh
roleRef:
  kind: Role
  name: mesh-control-plane-role
  apiGroup: rbac.authorization.k8s.io
