apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: mesh
  labels:
    app: inventory-service
    version: stable
    mesh: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
      version: stable
  template:
    metadata:
      labels:
        app: inventory-service
        version: stable
        mesh: "true"
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "v1"
            - name: FAULT_RATE
              value: "0"
            - name: PORT
              value: "8080"
        - name: mesh-sidecar
          image: mesh-sidecar:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 15001
            - containerPort: 15002
            - containerPort: 15006
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 15002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30   # 10 + 30×5 = до 160 сек на старт

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 15002
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 15002
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: MESH_SERVICE_ID
              value: "inventory-service"
            - name: MESH_CONTROL_PLANE_URL
              value: "http://mesh-control-plane.mesh.svc.cluster.local:8080"
            - name: LOCAL_SERVICE_PORT
              value: "8080"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: mesh
  labels:
    app: inventory-service
    version: stable
spec:
  selector:
    app: inventory-service
    version: stable
  ports:
    - name: http
      port: 8080
      targetPort: 15006    # трафик идёт через sidecar inbound, а не напрямую в бизнес-сервис
  type: ClusterIP
