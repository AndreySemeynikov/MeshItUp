apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mesh
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'mesh-sidecar'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['mesh']
        relabel_configs:
          # Оставляем только pod'ы с лейблом mesh=true
          - source_labels: [__meta_kubernetes_pod_label_mesh]
            action: keep
            regex: 'true'
          # Фильтруем по порту контейнера 15002 (metrics port)
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '15002'
          # Добавляем лейблы для метрик
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_version]
            action: replace
            target_label: version
        metrics_path: /actuator/prometheus
