apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mesh
  namespace: mesh
data:
  service-mesh.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (RPS) by version",
          "description": "Requests per second split by traffic version (stable vs canary)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 15, "pointSize": 5, "showPoints": "auto" },
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(mesh_proxy_requests_total{app!=\"api-gateway\"}[1m])) by (version)",
              "legendFormat": "{{version}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate (%) by version",
          "description": "Percentage of 5xx errors. Red threshold at 5% matches canary evaluator errorThreshold",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 },
              "unit": "percent",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 5 }
                ]
              },
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(mesh_proxy_errors_total{app!=\"api-gateway\"}[1m])) by (version) / sum(rate(mesh_proxy_requests_total{app!=\"api-gateway\"}[1m])) by (version) * 100",
              "legendFormat": "{{version}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Average Latency (ms) by version",
          "description": "Average request duration. Micrometer Timer exports _sum and _count, so avg = rate(sum) / rate(count)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 },
              "unit": "s",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "rate(mesh_proxy_request_duration_ms_seconds_sum[1m]) / rate(mesh_proxy_request_duration_ms_seconds_count[1m])",
              "legendFormat": "avg {{version}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Max Latency (ms) by version",
          "description": "Maximum observed request duration per scrape interval",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 },
              "unit": "s",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "mesh_proxy_request_duration_ms_seconds_max",
              "legendFormat": "max {{destination}} {{version}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Retries by version",
          "description": "Rate of retry attempts triggered by retriable status codes or connection errors",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 50 },
              "unit": "short",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(mesh_proxy_retries_total[1m])) by (version)",
              "legendFormat": "retries {{version}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "HTTP Status Codes",
          "description": "Request rate broken down by HTTP status code. Green=2xx, Yellow=4xx, Red=5xx",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "bars", "lineWidth": 1, "fillOpacity": 60, "stacking": { "mode": "normal" } },
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(mesh_proxy_requests_total{app!=\"api-gateway\"}[1m])) by (status)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "RPS by pod",
          "description": "Request rate per individual sidecar pod — shows load distribution across replicas",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 },
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(mesh_proxy_requests_total{app!=\"api-gateway\"}[1m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Error Rate by pod",
          "description": "Error percentage per pod — helps identify if a specific pod is unhealthy",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 },
              "unit": "percent",
              "min": 0,
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(mesh_proxy_errors_total{app!=\"api-gateway\"}[1m])) by (pod) / sum(rate(mesh_proxy_requests_total{app!=\"api-gateway\"}[1m])) by (pod) * 100",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Total requests (counter)",
          "description": "Cumulative total of requests processed by the mesh — shows overall growth",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "blue", "value": null }] }
            },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "sum(mesh_proxy_requests_total{app!=\"api-gateway\"})",
              "legendFormat": "total",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Total errors (counter)",
          "description": "Cumulative total of 5xx errors — shows overall error accumulation",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 32 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 10 }] }
            },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "expr": "sum(mesh_proxy_errors_total{app!=\"api-gateway\"})",
              "legendFormat": "errors",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-15m", "to": "now" },
      "title": "Service Mesh Overview",
      "uid": "mesh-overview"
    }